# Runs at /opt/apidrift on the droplet, behind the pinline project's Caddy (which already owns
# ports 80 and 443 on this host): the web service joins pinline's Docker network and pinline's
# Caddyfile gets one extra site block that proxies https://$APIDRIFT_HOST to apidrift-web:8000.
# The web service is NOT named `web`: Compose adds the service name as a DNS alias on every network it
# joins, and pinline's Caddy proxies to `web:8000`, so a `web` here would hijack half of pinline's traffic.
# First boot, in this order:
#   1. `apidrift app-setup` prints the registration values and the seven .env lines; write .env here.
#   2. mkdir -p data/snapshots secrets; copy the App's .pem to secrets/app.pem
#   3. seed the snapshots from the laptop:  rsync data/snapshots/stripe/ pinline:/opt/apidrift/data/snapshots/stripe/
#   4. then hand everything to the container uid (after the seed, so nothing is root-owned):
#        chown -R 10001:10001 data && chown 10001:10001 secrets/app.pem && chmod 400 secrets/app.pem
#   5. docker compose up -d --build, then add the site block to /opt/pinline/deploy/Caddyfile and reload pinline's caddy.
# Nothing is published directly; pinline's Caddy is the only entry point.
x-app: &app
  image: apidrift:latest
  restart: unless-stopped
  env_file: .env
  environment:
    APIDRIFT_DATA: /data
    APIDRIFT_GITHUB_PRIVATE_KEY_PATH: /secrets/app.pem
  volumes:
    - ./data:/data
    - ./secrets/app.pem:/secrets/app.pem:ro
  read_only: true
  tmpfs:
    - /tmp:size=256m
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  apidrift-web:
    <<: *app
    container_name: apidrift-web
    build: .
    command: ["apidrift", "serve", "--host", "0.0.0.0", "--port", "8000"]
    mem_limit: 512m
    pids_limit: 128
    expose:
      - "8000"
    networks:
      - default
      - edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    command: ["apidrift", "worker"]
    mem_limit: 3g
    pids_limit: 256
    depends_on:
      - apidrift-web

networks:
  edge:
    external: true
    name: pinline_default
